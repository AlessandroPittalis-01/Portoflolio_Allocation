[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prm"
version = "0.1.0"
description = "Risk-first multi-asset ETF portfolio allocation (educational project)"
requires-python = ">=3.10"
# Only what the code needs today. New libraries are added when a module needs them.
dependencies = ["pyyaml>=6", "pandas>=2.2", "numpy>=1.26", "yfinance>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
