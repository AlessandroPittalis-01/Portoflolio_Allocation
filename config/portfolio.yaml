# config/portfolio.yaml  [DECIDED by the owner 2026-11-04: IPS decisions 26 and 28]
#
# The owner fixes the CLASSES and how much RISK each class may carry. The code chooses the ETFs by rule
# (src/prm/allocation/choose.py), with no look at performance. Changing numbers here after seeing results
# is data snooping: if you do, write the reason in the IPS.

allocation:
  # Share of the portfolio's RISK (not of the capital) carried by each class. Must add up to 1.
  # Inside a class the budget is split equally among its ETFs. Equity is the only class that earns the
  # long-run premium, so it gets half of the risk; gold diversifies; bonds (and their EUR/PLN risk) the rest.
  class_budgets: {equity: 0.50, bond: 0.35, real: 0.15}

  # At most this many ETFs per class (total <= 6, IPS decision 9).
  max_etfs: {equity: 2, bond: 3, real: 1}

  selection:
    rho_max: 0.90             # correlation >= this = same exposure, only the most central ETF is kept
    min_overlap_days: 500     # a class needs this many common days to measure similarity
    min_history_years: 5      # same as the stage-02 criterion
    currency: EUR             # IPS decision 23

  covariance: ledoit_wolf     # sample | ewma | ledoit_wolf   (declared in advance, not tuned)
  ewma_lambda: 0.94
