    share_class: accumulating
    base_currency: EUR
    hedged: true
    eur_listings: [IS3V (Xetra)]
    yahoo_symbol: IS3V.DE        # CONFIRMED by probe (Oct 2026): 1661 rows from 2020-04-27, matches the fund launch date.
    history_proxy: "Distributing class IE00BD8PH174 (inception 2017-09-22, same strategy, TER 0.20%): declare as proxy"

  - id: gold
    accumulating: true
    category: gold
    risk_driver: gold
    name: iShares Physical Gold ETC
    isin: IE00B4ND3602
    ter_pct: 0.12
    inception: 2011-04-08
