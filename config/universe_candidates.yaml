    eur_listings: [verify]
    yahoo_symbol: XEON.DE        # CONFIRMED by probe (Oct 2026): 4277 rows from 2010-01-04. Flag 'stale_prices' to inspect (near-zero rates).
    note: "swap-based, so counterparty and tracking differences must be checked"

