    category: emerging_markets
    risk_driver: emerging equities
    name: iShares Core MSCI EM IMI UCITS ETF USD (Acc)
    isin: IE00BKM4GZ66
    ter_pct: 0.18
    inception: 2014-05-30
    share_class: accumulating
    base_currency: USD
    hedged: false
    eur_listings: [verify]      # an EUR line was reported on Borsa Italiana; confirm which exchange
    yahoo_symbol: IS3N.DE        # CONFIRMED by probe (Oct 2026): 3146 rows from 2014-06-11, Xetra EUR. EIMI.MI (Milan) also works but flags stale prices.
    underlying_currency_note: "TWD, KRW, CNY, INR... (top currencies per one aggregator: verify)"

  - id: global_bond_hedged
    accumulating: true
    category: global_bonds_hedged
    risk_driver: global bonds (EUR hedged)
    name: iShares Core Global Aggregate Bond UCITS ETF EUR Hedged (Acc)
    isin: IE00BDBRDM35
    ter_pct: 0.10
    inception: verify
    share_class: accumulating
    base_currency: EUR
    hedged: true                # hedged to EUR, so EUR/PLN risk remains
    eur_listings: [AGGH (Xetra)]
    alternative: "Vanguard Global Aggregate Bond UCITS ETF EUR Hedged Acc, TER ~0.08% (ISIN: verify)"
    yahoo_symbol: EUNA.DE        # CONFIRMED by --find (Oct 2026): XETRA listing, the fund name is exactly this ETF (AGGH on other exchanges). History from 2017-11-21. Shorter on Yahoo: AGGH.AS (from 2021-05-17), AGGH.MI (from 2019-06-12)

  - id: inflation_linked
    accumulating: true
    category: global_inflation_linked
    risk_driver: inflation-linked bonds (EUR hedged)
    name: iShares Global Inflation Linked Govt Bond UCITS ETF EUR Hedged (Acc)
    isin: IE00BKPT2S34
    ter_pct: 0.20
