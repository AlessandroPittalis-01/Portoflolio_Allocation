    accumulating: true
    category: world_developed
    risk_driver: developed equities
    name: iShares Core MSCI World UCITS ETF USD (Acc)
    isin: IE00B4L5Y983
    ter_pct: 0.20
    inception: 2009-09
    share_class: accumulating
    base_currency: USD
    hedged: false
    eur_listings: [IWDA (Euronext Amsterdam), EUNL (Xetra)]
    yahoo_symbol: EUNL.DE        # CONFIRMED by the owner, 2026-10-29: 1738 daily rows from 2020-01-01
    underlying_currency_note: "mostly USD (US weight around 70% per one aggregator: verify)"

  - id: em_equity
